name: Submit Firefox Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing validated GitHub Release tag to submit to AMO
        required: true
        type: string

permissions:
  contents: read
  attestations: read

concurrency:
  group: firefox-amo-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  submit:
    name: Firefox recovery — verify AMO has no duplicate or pending version before approval
    if: ${{ vars.FIREFOX_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: firefox-amo
      url: https://addons.mozilla.org/developers/addons
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.9.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          pnpm exec node scripts/verify-release-state.mjs release "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "git_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release download "$RELEASE_TAG" --dir artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GIT_SHA: ${{ steps.release.outputs.git_sha }}
          RELEASE_SIGNER_WORKFLOW: github.com/${{ github.repository }}/.github/workflows/release.yml
          RELEASE_SOURCE_REF: refs/tags/${{ steps.release.outputs.tag }}
        run: |
          for artifact in artifacts/*; do
            test -f "$artifact"
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$RELEASE_SIGNER_WORKFLOW" \
              --signer-digest "$RELEASE_GIT_SHA" \
              --source-digest "$RELEASE_GIT_SHA" \
              --source-ref "$RELEASE_SOURCE_REF" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --deny-self-hosted-runners
          done
      - env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_GIT_SHA: ${{ steps.release.outputs.git_sha }}
        run: node scripts/verify-release-assets.mjs artifacts
      - env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir firefox-release
          unzip -q "artifacts/OdooHealthExtCS-v${RELEASE_VERSION}-firefox.zip" -d firefox-release
      - env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          test -n "$WEB_EXT_API_KEY"
          test -n "$WEB_EXT_API_SECRET"
          pnpm exec web-ext sign \
            --source-dir firefox-release \
            --artifacts-dir signed \
            --channel listed \
            --amo-metadata store/firefox-update.json \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET" \
            --upload-source-code "artifacts/OdooHealthExtCS-v${{ steps.release.outputs.version }}-source.zip" \
            --no-input
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-signed-${{ steps.release.outputs.tag }}
          path: signed/*
          if-no-files-found: error
          retention-days: 30
      - run: |
          echo "## Firefox submission" >> "$GITHUB_STEP_SUMMARY"
          echo "Submitted ${{ steps.release.outputs.tag }} from its validated GitHub Release assets." >> "$GITHUB_STEP_SUMMARY"
          echo "AMO listing: https://addons.mozilla.org/en-US/firefox/addon/odoohealthextcs/" >> "$GITHUB_STEP_SUMMARY"
          echo "Review status: https://addons.mozilla.org/developers/addons" >> "$GITHUB_STEP_SUMMARY"
