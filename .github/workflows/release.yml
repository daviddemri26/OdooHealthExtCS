name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to recover
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: store-release
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
      git_sha: ${{ steps.identity.outputs.git_sha }}
      chrome_ready: ${{ steps.release_state.outputs.chrome_ready }}
      firefox_ready: ${{ steps.release_state.outputs.firefox_ready }}
    steps:
      - name: Validate manual recovery context
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.9.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        run: node -p '"version=" + require("./package.json").version' >> "$GITHUB_OUTPUT"
      - id: identity
        run: echo "git_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: pnpm package
      - run: pnpm verify:release-version
      - env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_GIT_SHA: ${{ steps.identity.outputs.git_sha }}
        run: node scripts/verify-release-assets.mjs artifacts
      - id: release_state
        run: node scripts/verify-release-state.mjs release "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: artifacts
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/*

  publish-github:
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" artifacts/* --clobber
            gh release edit "${RELEASE_TAG}" \
              --notes "" \
              --title "OdooHealthExtCS ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" \
              artifacts/* \
              --verify-tag \
              --notes "" \
              --title "OdooHealthExtCS ${RELEASE_TAG}"
          fi

  chrome:
    needs: [build, publish-github]
    if: ${{ needs.build.outputs.chrome_ready == 'true' && vars.CHROME_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: chrome-store
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: artifacts
      - env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_GIT_SHA: ${{ needs.build.outputs.git_sha }}
        run: node scripts/verify-release-assets.mjs artifacts
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
      - env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: node scripts/publish-chrome.mjs
      - run: echo "Chrome package submitted from $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"

  firefox:
    name: Firefox — verify AMO has no duplicate or pending version before approval
    needs: [build, publish-github]
    if: ${{ needs.build.outputs.firefox_ready == 'true' && vars.FIREFOX_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: firefox-amo
      url: https://addons.mozilla.org/developers/addons
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.9.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: artifacts
      - env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_GIT_SHA: ${{ needs.build.outputs.git_sha }}
        run: node scripts/verify-release-assets.mjs artifacts
      - env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir firefox-release
          unzip -q "artifacts/OdooHealthExtCS-v${RELEASE_VERSION}-firefox.zip" -d firefox-release
      - env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: >-
          pnpm exec web-ext sign
          --source-dir firefox-release
          --artifacts-dir signed
          --channel listed
          --amo-metadata store/firefox-update.json
          --api-key "$WEB_EXT_API_KEY"
          --api-secret "$WEB_EXT_API_SECRET"
          --upload-source-code "artifacts/OdooHealthExtCS-v${{ needs.build.outputs.version }}-source.zip"
          --no-input
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-signed-${{ env.RELEASE_TAG }}
          path: signed/*
          if-no-files-found: error
          retention-days: 30
      - run: |
          echo "Firefox listed submission sent from $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
          echo "Review status: https://addons.mozilla.org/developers/addons" >> "$GITHUB_STEP_SUMMARY"

  stores-disabled:
    needs: [build, publish-github]
    if: ${{ needs.build.outputs.chrome_ready != 'true' || vars.CHROME_PUBLISH_ENABLED != 'true' || needs.build.outputs.firefox_ready != 'true' || vars.FIREFOX_PUBLISH_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          echo "GitHub Release completed." >> "$GITHUB_STEP_SUMMARY"
          echo "A store is skipped until its initial version is published and its publish variable is true." >> "$GITHUB_STEP_SUMMARY"
