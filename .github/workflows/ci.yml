name: Validate and package

on:
  push:
    branches: ['**']
    tags-ignore: ['v*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - uses: actions/upload-artifact@v7
        with:
          name: OdooHealthExtCS-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
